# Actualiza la web sola: revisa YouTube, Deezer y Apple Music una vez al día
# y publica los videos/lanzamientos nuevos (con su noticia). Script:
# .github/scripts/actualizar-contenido.js   ·   Guía: EDITAR-WEB.txt sección 10
name: Actualizar web (YouTube, Deezer, Apple Music)

on:
  schedule:
    - cron: '30 23 * * *'   # todos los días 23:30 UTC = 19:30 en Bolivia
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-web
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar cwebp (para miniaturas y portadas)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Buscar novedades y actualizar data/
        env:
          RESUMEN_FILE: ${{ runner.temp }}/resumen.txt
        run: node .github/scripts/actualizar-contenido.js

      - name: Validar archivos
        run: |
          node --check data/banda.js
          node --check data/noticias.js
          node --check assets/js/sitio.js

      - name: Publicar si hubo cambios
        run: |
          if [ -z "$(git status --porcelain -- data assets)" ]; then
            echo "Sin cambios: la web ya estaba al día." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add data assets
          { echo "Actualización automática de la web"; echo; cat "$RUNNER_TEMP/resumen.txt" 2>/dev/null; } > "$RUNNER_TEMP/mensaje.txt"
          git commit -F "$RUNNER_TEMP/mensaje.txt"
          git pull --rebase origin main
          git push origin HEAD:main
          { echo "### Cambios publicados"; cat "$RUNNER_TEMP/resumen.txt" 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
